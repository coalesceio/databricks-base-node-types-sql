fileVersion: 2
id: SQLWork
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: Work
    short: WRK
    plural: Works
    tagColor: '#2EB67D'

    deployStrategy: advanced

    annotations:
        node:

        - groupName: Create Options
          description: >-
            Whether the node is created as a table or a view, and the Unity Catalog tags set on it after it is created.
          items:

            - name: materializationType
              description: |-
                • How the target object is created.
              isRequired: false
              parameters:
                - name: type
                  type: string
                  isRequired: true
                  default: table
                  options:
                    - table
                    - view

            - name: tag
              description: |-
                • Applies a Unity Catalog tag to this table or view (ALTER ... SET TAGS) after it is created.
                • Repeat the annotation to apply multiple tags; a tag key can only be used once per table or view.
                • Applies to views as well as tables.
                • To tag a column, put @tag on the column instead.
              allowsMultiple: true
              parameters:
                - name: tagName
                  type: string
                  description: • Tag key.
                  isRequired: true
                  example: cost_center

                - name: tagValue
                  type: string
                  description: • Tag value.
                  isRequired: true
                  example: finance

        - groupName: Load Options
          description: >-
            How each run loads the table.
          items:

            - name: writeMode
              description: >-
                Controls how data is written to the target table. 
                𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁 clears the table before loading, replacing its contents entirely;
                𝗮𝗽𝗽𝗲𝗻𝗱 inserts the new rows alongside whatever is already there.
                If not specified in the SQL, defaults to 𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁. 
                𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
              isRequired: false
              parameters:
                - name: mode
                  type: string
                  description: Whether to 𝗧𝗥𝗨𝗡𝗖𝗔𝗧𝗘 the target table before inserting, or 𝗔𝗣𝗣𝗘𝗡𝗗 to it.
                  isRequired: true
                  default: truncateInsert
                  example: append
                  options:
                    - truncateInsert
                    - append

        - groupName: Other Options
          description: >-
            Node-level data quality tests, and SQL that runs before or after the load.
          items:

            - name: disableTests
              type: boolean
              description: >-
                Controls whether configured tests are skipped.
                Useful while developing a node — skip node-level and column-level tests without deleting them, so you can iterate on the SQL first and turn tests back on once the logic is settled.
              isRequired: false
              default: false

            - name: tests
              description: >-
                Node-level data quality test.
                Runs the given 𝗾𝘂𝗲𝗿𝘆𝗦𝗤𝗟 against the target and fails the test if it returns any records — write the query so it selects only the rows that violate your condition.
                Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗿𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
                Skipped entirely when 𝗱𝗶𝘀𝗮𝗯𝗹𝗲𝗧𝗲𝘀𝘁𝘀 is set.
              allowsMultiple: true
              parameters:
                - name: querySQL
                  type: string
                  description: SQL statement to execute as a validation test.
                  isRequired: true
                  example: 'SELECT 1'

                - name: continueOnFailure
                  type: boolean
                  description: Determines whether execution continues when the test fails.
                  isRequired: false
                  default: true
                  parameters:
                  options:
                    - true
                    - false

                - name: runOrder
                  type: string
                  description: Determines whether the test is executed before or after the load operation.
                  isRequired: false
                  default: After
                  options:
                    - Before
                    - After

            - name: preSQL
              description: >-
                SQL statement to execute before the data load operation — e.g. staging setup, dropping temp tables, or capturing pre-load state.
                Repeat the annotation to run multiple statements in the order they appear.
                𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
              allowsMultiple: true
              parameters:
              - name: querySQL
                type: string
                description: Query to be executed.
                isRequired: true
                example: 'SELECT 1'

            - name: postSQL
              description: >-
                SQL statement to execute after the data load operation — e.g. updating dependent tables, cleaning up temp objects, or logging load completion.
                    Repeat the annotation to run multiple statements in the order they appear.
                    𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
              allowsMultiple: true
              parameters:
              - name: querySQL
                type: string
                description: Query to be executed.
                isRequired: true
                example: 'SELECT 1'

        column:

        - groupName: Table Specific Options
          description: >-
            Tables only: keys, clustering, partitioning and column tags. Ignored when the node is a view.
          items:

            - name: primaryKey
              description: |-
                • Marks this column as part of the table's PRIMARY KEY constraint, at the given position
                  (lowest first), e.g. primaryKey(1).
                • Mark every key column to build a composite key, e.g. primaryKey(1) on one column and primaryKey(2) on another.
                • Presence enables the key — remove the annotation to drop the column from it.
                • Key columns are created NOT NULL automatically (Databricks requires it).
                • 𝗡𝗼𝘁 𝗲𝗻𝗳𝗼𝗿𝗰𝗲𝗱 — Databricks primary keys are informational (Unity Catalog only); pair with uniqueness / not_null to test it.
                • Ignored on views.
              isRequired: false
              parameters:
                - name: position
                  type: number
                  isRequired: true
                  example: 1

            - name: clusterKey
              description: |-
                • Marks this column as part of the table's liquid clustering key (𝗖𝗟𝗨𝗦𝗧𝗘𝗥 𝗕𝗬), at the given position
                  (lowest first), e.g. clusterKey(1).
                • Databricks allows at most 4 clustering columns.
                • Cannot be combined with @partitionBy — Databricks rejects a table that is both partitioned and clustered.
                • On redeployment, clustering changes are applied in place (ALTER TABLE ... CLUSTER BY); existing data is reclustered by OPTIMIZE.
                • Ignored on views.
              parameters:
                - name: position
                  type: number
                  isRequired: true
                  example: 1

            - name: partitionBy
              description: |-
                • Adds this column to the table's 𝗣𝗔𝗥𝗧𝗜𝗧𝗜𝗢𝗡𝗘𝗗 𝗕𝗬 list.
                • Takes no parameters — write a bare @partitionBy.
                • Can be placed on more than one column; columns are partitioned in the order they appear.
                • Partitioning is set on columns only — there is no node-level @partitionBy.
                • Databricks partitions by columns only — to partition by an expression, compute it as a column in the SELECT:
                  CAST(last_modified AS DATE) AS `LOAD_DATE` @partitionBy
                • Cannot be combined with @clusterKey.
                • ⚠️ On redeployment, adding, removing or changing a partition column drops and recreates the table (Databricks cannot alter partitioning) — all existing rows are lost and the table is empty until the next run reloads it. For SCD Type 2 history this cannot be rebuilt from the source.
                • Ignored on views.
              isRequired: false

            - name: tag
              description: |-
                • Applies a Unity Catalog tag to this column, e.g. @tag("pii", "email").
                • Set after the table is created, one "Set Tags: `<column>`" stage per tagged column
                  (ALTER TABLE ... ALTER COLUMN ... SET TAGS); on redeployment a changed tag is set again, and a removed one unset with UNSET TAGS.
                • Repeat the annotation to apply multiple tags; a tag key can only be used once per column.
                • Ignored on views (a warning is raised) — use a node-level @tag to tag the view.
              allowsMultiple: true
              parameters:
                - name: tagName
                  type: string
                  description: • Tag key.
                  isRequired: true
                  example: pii

                - name: tagValue
                  type: string
                  description: • Tag value.
                  isRequired: true
                  example: email

        - groupName: Load Options
          description: >-
            Hashing used by the load.
          items:

            - name: inHash
              description: >-
                    Marks a column as an input to a generated hash key, grouped by 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲 and ordered within that group by 𝗵𝗮𝘀𝗵𝗢𝗿𝗱𝗲𝗿.
                    Mark every column that should feed a given hash with the same 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲, then call the 𝐠𝐞𝐭_𝐡𝐚𝐬𝐡("<hashName>") macro elsewhere in the SELECT to produce the actual hash column from those marked columns.
                    𝗦𝗲𝗲 𝗱𝗼𝗰𝘂𝗺𝗲𝗻𝘁𝗮𝘁𝗶𝗼𝗻 𝗳𝗼𝗿 𝗱𝗲𝘁𝗮𝗶𝗹𝘀.
              allowsMultiple: true
              parameters:
                - name: hashName
                  isRequired: true
                  type: string
                  description: Group hash name shared by every column feeding the same hash.
                  example: GH_COL

                - name: hashOrder
                  isRequired: true
                  type: number
                  description: Position of this column within its hash group, lowest first.
                  example: 1

        - groupName: Data Quality Tests
          description: >-
            🚦 Column-level data quality tests. Each runs after the load and continues the run on failure.
          items:

            - name: not_null
              description: >-
                🚦 Column-level data quality test.
                Fails on rows where the column is 𝗡𝗨𝗟𝗟.
                Presence enables the test — remove the annotation to turn it off.
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

            - name: uniqueness
              description: >- 
                🚦 Column-level data quality test.
                Fails when a value appears on more than one row.
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

            - name: empty
              description: >-
                🚦 Column-level data quality test.
                Fails on rows where the column trims to the empty string;
                𝗡𝗨𝗟𝗟 values pass this test and are instead caught by not_null.
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

            - name: accepted_values
              description: >-
                🚦 Column-level data quality test.
                Fails on rows whose value is outside the allow list.
                Repeat the annotation once per permitted value.
                Each value is pasted into the SQL verbatim, so quote it to match the column's data
                type — a number as accepted_values("<num>"), a string as accepted_values("'<string>'").
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
              allowsMultiple: true
              parameters:
                - name: value
                  type: string
                  isRequired: true

            - name: rejected_values
              description: >-
                🚦 Column-level data quality test.
                Fails on rows whose value is in the deny list.
                Repeat the annotation once per forbidden value. Each value is pasted into the SQL verbatim, so quote it to match the column's data type — a number as rejected_values("<num>"), a string as
                rejected_values("'<string>'").
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
              allowsMultiple: true
              parameters:
                - name: value
                  type: string
                  isRequired: true
                  example: "'<string>'"

            - name: min_max
              description: >-
                🚦 Column-level data quality test.
                Fails on rows outside the inclusive range.
                Both bounds are pasted into the SQL verbatim, so write a number as "0" and a date as "DATE '2026-01-01'".
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
              parameters:
                - name: min
                  type: string
                  description: Inclusive lower bound the column value must not fall below.
                  isRequired: true
                  example: "0"
                - name: max
                  type: string
                  description: Inclusive upper bound the column value must not exceed.
                  isRequired: true
                  example: "100"

            - name: min_value
              description: >-
                🚦 Column-level data quality test.
                Fails on rows below the bound.
                Pasted into the SQL verbatim — see min_max.
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
              parameters:
                - name: min
                  type: string
                  description: Inclusive lower bound the column value must not fall below.
                  isRequired: true
                  example: "0"

            - name: max_value
              description: >-
                🚦 Column-level data quality test.
                Fails on rows above the bound.
                Pasted into the SQL verbatim — see min_max.
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
              parameters:
                - name: max
                  type: string
                  description: Inclusive upper bound the column value must not exceed.
                  isRequired: true
                  example: "100"

            - name: freshness
              description: >-
                🚦 Column-level data quality test.
                Checks that the data is fresh — fails when the column's value is older than the given interval, or when the table has no rows at all.
                𝗡𝗼𝘁𝗲: on a DATE column the value is truncated to midnight.
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
              parameters:
                - name: interval
                  description: >-
                    How far back from now the newest value is allowed to be, expressed in the unit given by 𝘂𝗻𝗶𝘁.
                  type: number
                  isRequired: true
                  example: 1

                - name: unit
                  type: string
                  options: [SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, YEAR]
                  default: DAY

            - name: relative_time
              description: >-
                🚦 Column-level data quality test.
                Compares this column against another date/time column on the same node using the
                given operator.
                E.g. @relative_time("<=", "END_DATE") fails any row where this column's value is not less than or equal to END_DATE.
                A row with either side 𝗡𝗨𝗟𝗟 is left out of the check and passes.
                Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
              parameters:
                - name: operator
                  type: string
                  description: Comparison operator used to compare this column against the other column.
                  isRequired: true
                  options: ["<", "<=", ">", ">=", "=", "<>"]
                  example: "="

                - name: column
                  type: string
                  description: Name of the other date/time column on this node to compare against.
                  isRequired: true
                  example: "<other_column>"
name: Work
type: NodeType
